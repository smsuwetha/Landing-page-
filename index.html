<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1 class="logo">BrandName</h1>
      <nav>
        <ul>
          <li><a href="#features">Features</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h2>Welcome to Our Product</h2>
      <p>Boost your productivity with our cutting-edge tools.</p>
      <a href="#contact" class="btn">Get Started</a>
    </div>
  </section>

  <section id="features" class="features">
    <div class="container">
      <h3>Features</h3>
      <div class="feature-box">
        <div class="feature">🚀 Fast</div>
        <div class="feature">🔒 Secure</div>
        <div class="feature">📱 Responsive</div>
      </div>
    </div>
  </section>

  <section id="about" class="about">
    <div class="container">
      <h3>About Us</h3>
      <p>We provide innovative solutions to help businesses grow.</p>
    </div>

  <section id="contact" class="contact">
    <div class="container">
      <h3>Contact</h3>
      <form action="contact.php" method="POST">
        <input type="text" name="name" placeholder="Your Name" required><br><br>
        <input type="email" name="email" placeholder="Your Email" required><br><br>
        <textarea name="message" placeholder="Your Message" rows="5" required></textarea><br><br>
        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>© 2025 BrandName. All rights reserved.</p>
    </div>
